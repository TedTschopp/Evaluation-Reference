<p><a href="https://evals.tedt.org/">Open the AI evaluation lab in a full page</a></p>
<iframe id="ai-evaluation-lab" src="https://evals.tedt.org/?embed=1" title="Founding Documents AI Evaluation Lab" width="100%" height="1100" loading="lazy" style="border:1px solid #dbddd4;border-radius:6px"></iframe>
<script>
window.addEventListener("message", function (event) {
  if (event.origin !== "https://evals.tedt.org" || event.data?.type !== "eval-lab-height") return;
  const frame = document.getElementById("ai-evaluation-lab");
  if (event.source !== frame?.contentWindow) return;
  const height = Number(event.data.height);
  if (Number.isFinite(height)) frame.style.height = Math.max(700, Math.min(5000, height)) + "px";
});
</script>
