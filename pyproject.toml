[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "founding-eval-lab"
version = "1.2.0"
description = "A visual, Azure-independent Microsoft Agent Framework evaluation reference"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-framework-core==1.24.0",
  "agent-framework-openai==1.18.0",
  "agent-framework-ollama==1.0.0b261030",
  "openai>=2.25,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
python-app = ["streamlit>=1.40,<2", "pandas>=2.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "markdown>=3.7,<4"]

[project.scripts]
eval-lab = "eval_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary"
